<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pointer Preview</title>
    <link href="theme.css" rel="stylesheet">
    <link href="codicon.css" rel="stylesheet">
    <link href="highlight.css" rel="stylesheet">
    <style>
      * { box-sizing: border-box }
      html, body { margin: 0; height: 100%; background: var(--vscode-editor-background); color: var(--vscode-foreground); font: var(--vscode-font-size) var(--vscode-font-family) }
      .window { display: grid; grid-template-rows: 32px 1fr 22px; height: 100% }
      .titlebar { display: flex; align-items: center; gap: 12px; padding: 0 12px; background: var(--vscode-titleBar-activeBackground); border-bottom: 1px solid var(--vscode-panel-border); font-size: 12px; color: var(--vscode-descriptionForeground) }
      .titlebar strong { color: var(--vscode-foreground); font-weight: 600 }
      .titlebar .spacer { flex: 1 }
      .titlebar button { background: none; border: 1px solid var(--vscode-panel-border); color: var(--vscode-foreground); border-radius: 4px; padding: 2px 8px; font: inherit; cursor: pointer }
      .body { display: grid; grid-template-columns: 48px minmax(0, 1fr) minmax(320px, 420px); min-height: 0 }
      .activity { background: var(--vscode-activityBar-background); border-right: 1px solid var(--vscode-panel-border); display: flex; flex-direction: column; align-items: center; gap: 18px; padding-top: 12px; font-size: 22px; color: var(--vscode-descriptionForeground) }
      .activity .on { color: var(--vscode-foreground) }
      .main { display: grid; grid-template-rows: 35px 1fr; min-width: 0; min-height: 0 }
      #tabs { display: flex; background: var(--vscode-tab-inactiveBackground); border-bottom: 1px solid var(--vscode-panel-border); overflow-x: auto }
      .tab { background: none; border: 0; border-right: 1px solid var(--vscode-panel-border); color: var(--vscode-descriptionForeground); padding: 0 14px; font: inherit; cursor: pointer }
      .tab.active { background: var(--vscode-tab-activeBackground); color: var(--vscode-foreground); box-shadow: inset 0 1px 0 var(--vscode-focusBorder) }
      #editor { overflow: auto; padding: 8px 0 40px; font-family: var(--vscode-editor-font-family); font-size: var(--vscode-editor-font-size) }
      .crumbs { padding: 2px 20px 10px; color: var(--vscode-descriptionForeground); font-family: var(--vscode-font-family); font-size: 12px }
      .hunk { margin: 0 0 16px }
      .hunk-bar { display: flex; align-items: center; gap: 8px; padding: 4px 20px; font-family: var(--vscode-font-family); font-size: 12px; color: var(--vscode-descriptionForeground); border-top: 1px solid var(--vscode-panel-border) }
      .hunk-bar button { border: 0; border-radius: 3px; padding: 2px 10px; font: inherit; cursor: pointer; background: var(--vscode-button-secondaryBackground); color: var(--vscode-button-secondaryForeground) }
      .hunk-bar button.primary { background: var(--vscode-button-background); color: var(--vscode-button-foreground) }
      .line { display: flex; white-space: pre; line-height: 18px }
      .line.add { background: var(--vscode-diffEditor-insertedLineBackground) }
      .line.del { background: var(--vscode-diffEditor-removedLineBackground); opacity: 0.85 }
      .gutter { width: 56px; padding-right: 14px; text-align: right; color: var(--vscode-descriptionForeground); flex: none; user-select: none }
      .welcome { max-width: 640px; padding: 48px 32px; font-family: var(--vscode-font-family) }
      .welcome h1 { font-weight: 400; font-size: 28px; margin: 0 0 12px }
      .welcome p { color: var(--vscode-descriptionForeground); line-height: 1.5 }
      .welcome pre { white-space: pre-wrap; background: var(--vscode-editorWidget-background); border: 1px solid var(--vscode-editorWidget-border); border-radius: 6px; padding: 12px 14px; font-family: var(--vscode-editor-font-family); font-size: 12px; line-height: 1.5 }
      #panel { width: 100%; height: 100%; border: 0; border-left: 1px solid var(--vscode-panel-border); background: var(--vscode-sideBar-background) }
      .status { display: flex; align-items: center; gap: 14px; padding: 0 10px; background: var(--vscode-statusBar-background); border-top: 1px solid var(--vscode-panel-border); font-size: 12px; color: var(--vscode-descriptionForeground) }
      @media (max-width: 760px) { .body { grid-template-columns: 1fr } .activity, .main { display: none } }
    </style>
  </head>
  <body>
    <div class="window">
      <header class="titlebar">
        <strong>Pointer</strong><span>flask · pallets/flask 3.1.3</span>
        <span class="spacer"></span>
        <span>Replay: tool outputs recorded from the real engines; the pytest run is real</span>
        <button id="theme" type="button">Light / Dark</button>
      </header>
      <div class="body">
        <nav class="activity" aria-hidden="true">
          <i class="codicon codicon-files"></i><i class="codicon codicon-search"></i><i class="codicon codicon-source-control"></i><i class="codicon codicon-hubot on"></i>
        </nav>
        <main class="main">
          <div id="tabs"></div>
          <div id="editor"></div>
        </main>
        <iframe id="panel" src="panel.html?theme=dark" title="Pointer panel"></iframe>
      </div>
      <footer class="status"><span>main</span><span>TrueForge · pointer/primary</span><span>Python 3.13</span></footer>
    </div>
    <script src="editor.js"></script>
  </body>
</html>
