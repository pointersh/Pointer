[package]
name = "pointer-retrieval"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Pointer's retrieval engine: repo map, BM25 and symbol search over the workspace, served as an MCP server."

[dependencies]
rmcp = { version = "3", features = ["server", "macros", "transport-streamable-http-server"] }
tokio = { version = "1", features = ["full"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
ignore = "0.4"
rayon = "1"
tree-sitter = "0.25"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-go = "0.25"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
notify = "8"
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
